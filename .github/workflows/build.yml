name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build APK
        run: dotnet build ATHLET/Athlet.csproj -c Debug -f net8.0-android -p:EmbedAssembliesIntoApk=true -p:AndroidSdkDirectory=$ANDROID_HOME
      - name: Collect APK
        run: |
          mkdir -p out
          find ATHLET/bin -name '*-Signed.apk' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ATHLET-apk
          path: out/*.apk
